name: Feature request
description: Something SQL Blame should capture, show or do
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What you are trying to do
      description: The situation and the question you want SQL Blame to answer.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
      description: How you imagine it in the tool window, if you have an idea.
